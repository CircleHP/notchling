name: Release

# Three ways in, and they differ only in what happens at the end:
#
#   dispatch with a version   bumps the version, tags it, builds and publishes
#   push of a v* tag          builds and publishes that tag, for a locally-made tag
#   dispatch with none        builds and uploads the artifact, publishing nothing — a real dry run
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v. Blank builds without publishing.
        required: false
        default: ""

# Publishing a release, and pushing the version bump that precedes it, both write to the repository.
permissions:
  contents: write

# Never cancel a run that might be halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    # Not the matrix CI uses: Xcode 16.4 / Swift 6.1.2 cannot link a universal binary. See the note
    # on CI's dist step. Building against a newer SDK is safe because Swift checks availability
    # against the deployment target, which Package.swift pins to macOS 14.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Recorded so a release that misbehaves can be tied to the toolchain that built it.
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      # A release ships a binary nobody compiled themselves, so it runs the suite rather than
      # trusting that the commit was green when it landed on main. Before the tag, deliberately:
      # a tag is a promise, and one pointing at a failing tree is worse than no tag.
      - name: Test
        run: make test

      - name: Assert the hook binary was built, so no test skipped itself
        run: test -x .build/debug/notchling-hook

      # The version lives in two files because two different things read it: `make dist` names the
      # tarball from the plist, and an installed plugin updates when its own version moves.
      - name: Bump and tag
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version: $VERSION" >&2; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists" >&2
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          manifest=plugins/notchling/.claude-plugin/plugin.json
          jq --arg v "$VERSION" '.version = $v' "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"

          git config user.name "CircleHP"
          git config user.email "evmenovdv@gmail.com"
          if ! git diff --quiet; then
            git commit -aqm "chore: $VERSION"
            git push origin HEAD:main
          fi
          git tag -a "v$VERSION" -m "Notchling $VERSION"
          git push origin "v$VERSION"

          {
            echo "RELEASE_TAG=v$VERSION"
            echo "PUBLISH=true"
          } >> "$GITHUB_ENV"

      - name: Publish a tag that was pushed by hand
        if: github.ref_type == 'tag'
        run: |
          {
            echo "RELEASE_TAG=$GITHUB_REF_NAME"
            echo "PUBLISH=true"
          } >> "$GITHUB_ENV"

      # The tag, the app's version and the plugin's version all have to agree: a formula's url
      # embeds the tag, `make dist` names the tarball from the plist, and the plugin's version is
      # what tells an installed copy to update. A mismatch is only discoverable once it is public.
      - name: Assert the versions agree
        run: |
          plist=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          plugin=$(jq -r .version plugins/notchling/.claude-plugin/plugin.json)
          echo "plist=$plist plugin=$plugin tag=${RELEASE_TAG:-none}"
          test "$plist" = "$plugin"
          if [ "${PUBLISH:-false}" = true ]; then test "v$plist" = "$RELEASE_TAG"; fi

      # `make dist` verifies its own output: both architectures, the macOS 14 floor, the archive
      # layout a formula expects, a signature that survives unpacking, and a matching checksum.
      - name: Build the tarball
        run: make dist SIGN_ID=

      # Uploaded on every run, including ones that publish nothing. That is what makes a dry run a
      # real one rather than a rehearsal of the first half.
      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: notchling-dist
          path: .build/dist/*
          if-no-files-found: error

      # The checksum file ships beside the tarball so a formula's sha256 can be taken from the
      # release rather than recomputed by hand — though the tap verifies it against the download.
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          gh release create "$RELEASE_TAG" \
            ".build/dist/notchling-$version-universal.tar.gz" \
            ".build/dist/notchling-$version-universal.tar.gz.sha256" \
            --title "$RELEASE_TAG" \
            --generate-notes
