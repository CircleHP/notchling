name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push should not keep a macOS runner busy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned rather than macos-latest on purpose: Package.swift declares
        # swift-tools-version 6.0 and .macOS(.v14), and an image rolling forward is
        # exactly the kind of thing that turns a green build red on an unrelated day.
        #
        # macos-15 is the oldest image still supported (macos-14 is deprecated) and
        # carries the Xcode 16 toolchain the package declares as its floor. macos-26
        # is where the project is actually developed, so both ends are covered.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      # Recorded so a failure arriving on an unrelated day can be attributed to a
      # toolchain bump rather than to whichever commit happened to trigger it.
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      # Warnings-as-errors belongs in CI and not in the local loop: mid-refactor
      # warnings are useful while you work, and only matter at the point of merge.
      - name: Build, warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors

      # `make test` rather than `swift test`. The hook-contract tests drive the real
      # notchling-hook binary as a subprocess and skip themselves when it is absent,
      # so a bare `swift test` would quietly not run the tests covering the one
      # contract that can break a user's session.
      - name: Test
        run: make test

      # That skip is silent, so prove it did not happen. Without this the job could
      # be green while testing less than it appears to.
      - name: Assert the hook binary was built, so no test skipped itself
        run: test -x .build/debug/notchling-hook

      # What `make install` assembles, minus everything that touches $HOME. Install
      # itself must never run here: it writes to ~/Applications and edits
      # ~/.claude/settings.json. SIGN_ID= forces ad-hoc signing rather than reading a
      # login keychain that does not exist on a runner.
      - name: Bundle, and verify the signature seals it
        run: |
          make bundle SIGN_ID=
          codesign --verify --deep --strict .build/bundle/Notchling.app

      # The artifact a release ships, built the way a release builds it. The step above
      # covers what a contributor compiles; this covers what everyone else downloads,
      # and it is the only place a universal build can break before a tag depends on
      # it. It rebuilds rather than reusing the native bundle above, which is the
      # point: --arch moves SwiftPM's output directory.
      #
      # macos-26 only. The universal build needs a toolchain that can link one:
      # Xcode 16.4 / Swift 6.1.2 on macos-15 fails in CreateUniversalBinary with
      # duplicate output files whose paths are malformed, while Xcode 26.6 /
      # Swift 6.3.3 builds it. That costs nothing here — a release is built on one
      # machine, and every other step above still runs on both, so the floor
      # toolchain the package declares stays covered.
      - name: Dist tarball
        if: matrix.os == 'macos-26'
        run: make dist SIGN_ID=

  # Advisory. The package builds in Swift 5 language mode, and these are the diagnostics
  # it would have to answer before that moves — so warnings are reported, not enforced.
  # What it buys today is a standing list: the DirectoryWatcher race was found by reading
  # the file, and this is what makes the next one arrive as a diff instead of a bug report.
  #
  # An error still fails the job. A hard isolation error means the tree no longer compiles
  # under the rules the language is moving to, which is worth knowing on the commit that
  # introduces it rather than on the day the mode changes.
  #
  # One runner, not the matrix: the diagnostics come from the compiler, not the OS, and
  # macos-26 carries the newer of the two toolchains — the one that sees more.
  concurrency-checking:
    name: strict concurrency
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Build with complete concurrency checking
        run: |
          set -o pipefail
          swift build -Xswiftc -strict-concurrency=complete 2>&1 | tee strict.log

      - name: Report
        if: always()
        run: |
          # Deduplicated: a file compiled into more than one module reports the same
          # diagnostic once per module, and a raw count reads as several times the problem.
          diagnostics=$(grep -E '^/.*(warning|error):' strict.log \
            | sed -E 's#^.*/notchling/##' | sort -u || true)
          {
            printf '## Strict concurrency\n\n'
            printf '%s diagnostics.\n\n' "$(printf '%s' "$diagnostics" | grep -c . || true)"
            printf '```\n%s\n```\n' "$diagnostics"
          } >> "$GITHUB_STEP_SUMMARY"
